name: Orion CRM - Continuous Integration (CI)

# Déclenchement automatique du pipeline
on:
    push:
        branches: [main, develop, "**"]
    pull_request:
        branches: [main, develop, "**"]

    # Plan de testing périodique : exécution automatique chaque nuit à 02h00 UTC
    schedule:
      - cron: '0 2 * * *'

jobs:  

    # JOB 1 : Exécution des Tests Unitaires & couverture de code (vitest)
    unit-testing:
        name: Tests Unitaires & couverture de code (vitest)
        runs-on: ubuntu-latest

        steps:
            - name: Récupération du code source
              uses: actions/checkout@v4

            - name: Configuration de Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: |
                      server/package-lock.json
                      client/package-lock.json

            - name: Installation des dépendances Back-end
              run: |
                  cd server
                  npm ci --ignore-scripts

            - name: Installation des dépendances Front-end
              run: |
                  cd client
                  npm ci --ignore-scripts

            - name: Génération du client Prisma
              run: |
                  cd server
                  npx prisma generate

            - name: Tests & Rapport de couverture Back-end
              run: |
                  cd server
                  npm run test:coverage -- --run

            - name: Tests & Rapport de couverture Front-end
              run: |
                  cd client
                  npm run test:coverage -- --run
            
            - name: Publication du rapport de couverture Back-end
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-server
                  path: server/coverage/

            - name: Publication du rapport de couverture Front-end
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-client
                  path: client/coverage/


    # JOB 2 : Analyse de Sécurité & Qualité (SonarQube Cloud)
    sonarqube-scan:
        name: Analyse SonarQube Cloud
        runs-on: ubuntu-latest
        needs: unit-testing

        steps:
            - name: Récupération du code source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Nécessaire pour l’analyse de blame SonarQube

            - name: Configuration de Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: |
                      server/package-lock.json
                      client/package-lock.json

            - name: Installation des dépendances Back-end
              run: |
                  cd server
                  npm ci --ignore-scripts

            - name: Installation des dépendances Front-end
              run: |
                  cd client
                  npm ci --ignore-scripts

            - name: Téléchargement du rapport de couverture Back-end
              uses: actions/download-artifact@v4
              with:
                  name: coverage-server
                  path: server/coverage/

            - name: Téléchargement du rapport de couverture Front-end
              uses: actions/download-artifact@v4
              with:
                  name: coverage-client
                  path: client/coverage/


            - name: Analyse SonarQube Cloud
              uses: sonarsource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # JOB 3 : Compilation des Artefacts (Builds)
    build-applications:
        name: Build (Front & Back)
        runs-on: ubuntu-latest
        needs: sonarqube-scan

        steps:
            - name: Récupération du code source
              uses: actions/checkout@v4

            - name: Configuration de Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: |
                      server/package-lock.json
                      client/package-lock.json

            - name: Installation des dépendances Back-end
              run: |
                  cd server
                  npm ci --ignore-scripts

            - name: Installation des dépendances Front-end
              run: |
                  cd client
                  npm ci --ignore-scripts

            - name: Génération du client Prisma
              run: |
                  cd server
                  npx prisma generate

            - name: Build du Back-end (TypeScript -> JS)
              run: |
                  cd server
                  npm run build

            - name: Build du Front-end (Vite)
              run: |
                  cd client
                  npm run build

    # JOB 4 : Déploiement Continu - Publication des Images Docker
    docker-publish:
        name: Déploiement - Build & Push Docker Hub
        runs-on: ubuntu-latest
        needs: build-applications

        steps:
            - name: Récupération du code source
              uses: actions/checkout@v4

            - name: Configuration de Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

            - name: Connexion à Docker Hub
              uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build et Push Image Back-end
              uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
              with:
                  context: ./server
                  file: ./server/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/orion-crm-backend:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/orion-crm-backend:${{ github.sha }}

            - name: Build et Push Image Front-end
              uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
              with:
                  context: ./client
                  file: ./client/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/orion-crm-frontend:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/orion-crm-frontend:${{ github.sha }}

version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: orion-crm-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
    volumes:
      - sqlite-data:/app/prisma
    networks:
      - orion-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: orion-crm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - orion-network
    restart: unless-stopped

volumes:
  sqlite-data:

networks:
  orion-network:
    driver: bridge
